# Example Home Assistant configuration for Ireland electricity tariffs
# Place this in your configuration.yaml or in a separate file and include it

# REST sensor to fetch tariff data
rest:
  - resource: "https://github.com/conallob/ireland-electricity-tariffs/releases/latest/download/home_assistant_tariffs.json"
    scan_interval: 86400  # Update once per day
    sensor:
      - name: "Ireland Electricity Tariffs"
        value_template: "OK"
        json_attributes_path: "$.tariffs"
        json_attributes:
          - "energia-smart-15"
          - "electric-ireland-standard"
          - "electric-ireland-smart-dual-fuel"
          - "electric-ireland-smart-24hr"
          - "electric-ireland-smart-weekender-sat"
          - "bord-gais-standard"

# Template sensors to extract individual tariff rates
template:
  - sensor:
      # Energia Smart 15 tariff rates
      - name: "Energia Smart 15 Day Rate"
        unit_of_measurement: "EUR/kWh"
        state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'energia-smart-15')['rates']['day'] }}"

      - name: "Energia Smart 15 Night Rate"
        unit_of_measurement: "EUR/kWh"
        state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'energia-smart-15')['rates']['night'] }}"

      - name: "Energia Smart 15 Peak Rate"
        unit_of_measurement: "EUR/kWh"
        state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'energia-smart-15')['rates']['peak'] }}"

      # Electric Ireland Standard tariff rates
      - name: "Electric Ireland Standard Day Rate"
        unit_of_measurement: "EUR/kWh"
        state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'electric-ireland-standard')['rates']['day'] }}"

      - name: "Electric Ireland Standard Night Rate"
        unit_of_measurement: "EUR/kWh"
        state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'electric-ireland-standard')['rates']['night'] }}"

      - name: "Electric Ireland Standard Peak Rate"
        unit_of_measurement: "EUR/kWh"
        state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'electric-ireland-standard')['rates']['peak'] }}"

      # Electric Ireland Smart 24hr — flat rate, same for all periods
      - name: "Electric Ireland Smart 24hr Rate"
        unit_of_measurement: "EUR/kWh"
        state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'electric-ireland-smart-24hr')['rates']['day'] }}"

      # Electric Ireland Smart Weekender SAT tariff rates
      - name: "Electric Ireland Smart Weekender SAT Day Rate"
        unit_of_measurement: "EUR/kWh"
        state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'electric-ireland-smart-weekender-sat')['rates']['day'] }}"

      - name: "Electric Ireland Smart Weekender SAT Weekend Rate"
        unit_of_measurement: "EUR/kWh"
        state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'electric-ireland-smart-weekender-sat')['rates']['peak'] }}"

      # Current unit price of grid electricity — updates every minute based on time of day.
      # Edit 'electric-ireland-smart-24hr' below to match your own plan shortname.
      # For time-of-use plans the sensor picks the right band automatically;
      # for the Smart 24hr flat-rate plan it always returns the single unit price.
      - name: "Current Grid Electricity Price"
        unit_of_measurement: "EUR/kWh"
        device_class: monetary
        state_class: measurement
        icon: mdi:flash
        state: >
          {% set plan = 'electric-ireland-smart-24hr' %}
          {% set rates = state_attr('sensor.ireland_electricity_tariffs', plan) %}
          {% if rates is none %}
            unavailable
          {% else %}
            {% set h = now().hour %}
            {% set dow = now().weekday() %}  {# 0=Monday … 6=Sunday #}
            {% if plan == 'electric-ireland-smart-weekender-sat' %}
              {# Free on Saturdays (weekday index 5) #}
              {% if dow == 5 %}
                {{ rates['rates']['peak'] }}
              {% elif h >= 23 or h < 8 %}
                {{ rates['rates']['night'] }}
              {% else %}
                {{ rates['rates']['day'] }}
              {% endif %}
            {% elif plan in ['electric-ireland-standard', 'energia-smart-15', 'bord-gais-standard'] %}
              {# Night: 23:00–08:00  Peak: 17:00–19:00  Day: everything else #}
              {% if h >= 23 or h < 8 %}
                {{ rates['rates']['night'] }}
              {% elif h >= 17 and h < 19 %}
                {{ rates['rates']['peak'] }}
              {% else %}
                {{ rates['rates']['day'] }}
              {% endif %}
            {% else %}
              {# Flat-rate plans (e.g. Smart 24hr): single unit price all day #}
              {{ rates['rates']['day'] }}
            {% endif %}
          {% endif %}

# Utility meter with tariff tracking
# This example assumes you have a sensor called sensor.energy_consumption tracking your usage
utility_meter:
  daily_energy:
    source: sensor.energy_consumption
    name: Daily Energy
    cycle: daily
    tariffs:
      - day
      - night
      - peak

# Example automation to switch tariffs based on time
# Adjust times according to your provider's tariff schedule
automation:
  - alias: "Set Night Tariff"
    trigger:
      - platform: time
        at: "23:00:00"
    action:
      - service: utility_meter.select_tariff
        target:
          entity_id: utility_meter.daily_energy
        data:
          tariff: "night"

  - alias: "Set Day Tariff"
    trigger:
      - platform: time
        at: "08:00:00"
    action:
      - service: utility_meter.select_tariff
        target:
          entity_id: utility_meter.daily_energy
        data:
          tariff: "day"

  - alias: "Set Peak Tariff"
    trigger:
      - platform: time
        at: "17:00:00"
    action:
      - service: utility_meter.select_tariff
        target:
          entity_id: utility_meter.daily_energy
        data:
          tariff: "peak"
